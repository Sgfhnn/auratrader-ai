services:
  - type: web
    name: auratrader-ai
    runtime: python
    repo: https://github.com/Sgfhnn/auratrader-ai
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run Home.py --server.port=8501 --server.address=0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
